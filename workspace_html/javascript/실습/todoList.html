<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todoList</title>
    <style>
        .todo-item { margin-bottom: 5px; }
        .delete-btn { margin-left: 10px; color: red; cursor: pointer; }
        #addBtn, #deleteSelectBtn { cursor: pointer; }
    </style>
</head>
<body>
<!-- 이 코드는 구글 제미나이의 도움을 받아 작성되었음을 밝힙니다.-->
<h3>Todo List </h3>
<input type="text" id="todoInput" placeholder="할 일을 입력하세요">
<button id="addBtn">추가</button>
<br><br>

<label><input type='checkbox' id='selectAll'>전체 선택</label>
<button id="deleteSelectBtn">선택 삭제</button>

<div id="todoList"></div>

<script>
    const todoInput = document.getElementById('todoInput');
    const addBtn = document.getElementById('addBtn');
    const todoList = document.getElementById('todoList');
    const selectAll = document.getElementById('selectAll');
    const deleteSelectBtn = document.getElementById('deleteSelectBtn');

    // 1. 할 일 데이터를 저장할 핵심 배열! (이제 화면이 아니라 이 배열이 기준이에요)
    let todos = []; 

    // 2. 로컬 스토리지에 데이터 저장하기
    function saveTodos() {
        localStorage.setItem('myTodos', JSON.stringify(todos));
    }

    // 3. 배열을 바탕으로 화면(DOM)을 다시 그리는 함수
    function renderTodos() {
        todoList.innerHTML = ''; // 일단 화면을 싹 비워요!
        
        todos.forEach((todo, index) => {
            const div = document.createElement('div');
            div.className = 'todo-item';
            
            // data-index를 달아줘서 나중에 클릭했을 때 몇 번째 항목인지 알 수 있게 해요
            div.innerHTML = `
                <label>
                    <input type='checkbox' class='todo-check' data-index='${index}' ${todo.completed ? 'checked' : ''}>
                    <span style="text-decoration: ${todo.completed ? 'line-through' : 'none'}">${todo.text}</span>
                </label>
                <button class='delete-btn' data-index='${index}'>삭제</button>
            `;
            todoList.appendChild(div);
        });
        
        // 화면을 새로 그렸으니 전체 선택 체크박스 상태도 갱신해야죠!
        updateSelectAll(); 
    }

    // 4. 전체 선택 체크박스 상태 갱신 함수 (배열 기반으로 훨씬 깔끔해졌어요!)
    function updateSelectAll() {
        if(todos.length === 0) {
            selectAll.checked = false;
        } else {
            // 모든 항목의 completed가 true인지 검사해요
            const allChecked = todos.every(todo => todo.completed);
            selectAll.checked = allChecked;
        }
    }

    // 5. 처음에 데이터 불러오기
    function loadTodos() {
        const saved = localStorage.getItem('myTodos');
        if(saved) {
            todos = JSON.parse(saved); // 포장 뜯어서 배열에 넣고
            renderTodos(); // 화면에 쫙 그려줘요!
        }
    }

    // --- 여기서부터는 이벤트 리스너 ---

    // 추가 버튼
    addBtn.addEventListener('click', function() {
        if(todoInput.value.trim() === '') return;

        // 화면에 바로 그리는 게 아니라 '배열'에 데이터를 추가해요
        todos.push({
            text: todoInput.value,
            completed: false // 처음 추가할 땐 당연히 체크 안 된 상태죠!
        });
        
        todoInput.value = ''; 
        saveTodos(); // 배열이 바뀌었으니 창고에 저장!
        renderTodos(); // 바뀐 배열을 바탕으로 화면 다시 그리기!
    });

    // 개별 삭제 버튼 (이벤트 위임)
    todoList.addEventListener('click', function(e) {
        if(e.target.classList.contains('delete-btn')) {
            const index = e.target.getAttribute('data-index');
            todos.splice(index, 1); // 배열에서 해당 인덱스를 썰어버려요!
            
            saveTodos(); 
            renderTodos(); 
        }
    });
    
    // 개별 체크 감지 (이벤트 위임)
    todoList.addEventListener('change', function(e) {
        if(e.target.classList.contains('todo-check')) {
            const index = e.target.getAttribute('data-index');
            todos[index].completed = e.target.checked; // 배열의 완료 상태 업데이트
            
            saveTodos();
            renderTodos(); // 다시 그리면 취소선도 알아서 적용돼요!
        }
    });

    // 전체 선택 체크박스 
    selectAll.addEventListener('change', function() {
        const isChecked = selectAll.checked;
        
        // 배열을 돌면서 전부 상태를 통일시켜 버려요
        todos.forEach(todo => {
            todo.completed = isChecked;
        });
        
        saveTodos();
        renderTodos();
    });

    // 선택 삭제 버튼 
    deleteSelectBtn.addEventListener('click', function() {
        // completed가 false인(안 끝난) 애들만 걸러서 배열을 덮어씌워요!
        todos = todos.filter(todo => !todo.completed);
        
        saveTodos();
        renderTodos();
    });

    // 스크립트 맨 마지막! 페이지가 켜지면 무조건 한 번 실행!
    loadTodos();

    // 입력창에서 키보드를 뗄 때 발생하는 이벤트 감지
    todoInput.addEventListener('keyup', function(e) {
        // 방금 뗀 키가 'Enter' 키인지 확인!
        if (e.key === 'Enter') {
            // '추가' 버튼을 마우스로 꾹 누른 것과 완전히 똑같은 효과를 내요!
            addBtn.click(); 
        }
    });
</script>
</body>
</html>
