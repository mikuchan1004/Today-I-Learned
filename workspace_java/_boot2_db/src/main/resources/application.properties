# ========================================================
# [Spring Boot 핵심 환경 설정 파일 (application.properties)]
# ========================================================

# 애플리케이션 이름 정의
spring.application.name=boot_web

# [서버 포트 설정]
# 기본값은 8080이며, 다른 포트(예: 5000)로 변경하고 싶을 때 주석을 해제합니다.
#server.port=5000

# [JSP 뷰 리졸버(View Resolver) 설정]
# 컨트롤러가 "result"라는 문자열을 반환하면
# 접두사(prefix) + 파일명 + 접미사(suffix)가 결합되어
# 실제 파일 경로: /WEB-INF/jsp/result.jsp 를 찾아 브라우저로 렌더링합니다.
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# [개발 편의 기능: 실시간 리로드(LiveReload)]
# JSP 파일 수정 시 서버 재시작 없이 브라우저에 즉시 반영
server.servlet.jsp.init-parameters.development=true
# Java 소스 코드 변경 시 스프링 부트 서버 자동 재시작
spring.devtools.livereload.enabled=true

# [데이터베이스 및 SQL 로깅 설정 (log4jdbc)]
# log4jdbc: 실제 실행되는 쿼리와 ?에 바인딩된 파라미터 값을 콘솔에 표 형태로 깔끔하게 출력해 주는 라이브러리
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
# MariaDB 접속 주소 (localhost:3306 포트의 human 데이터베이스)
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:3306/human
# DB 사용자 계정 및 비밀번호
spring.datasource.username=root
spring.datasource.password=human1234$

# [MyBatis(마이바티스) 프레임워크 설정]
# 1. mapper-locations: SQL이 작성된 XML 매퍼 파일들의 위치 지정 (resources 폴더 기준)
#    '/**/**.xml' -> mappers 폴더 하위의 모든 폴더 및 하위 xml 파일 인식
mybatis.mapper-locations=classpath:mybatis/mappers/**/**.xml

# 2. jdbc-type-for-null: 파라미터가 null일 때 DB에 NULL로 안전하게 전달되도록 설정 (누락 시 부적절한 열 유형 오류 방지)
mybatis.configuration.jdbc-type-for-null=NULL

# 3. type-aliases-package: XML 매퍼에서 DTO 클래스명을 패키지 경로 없이 간단하게(소문자/카멜케이스) 쓸 수 있도록 별칭 등록
#    예: com.example.demo.dto.EmpDTO -> resultType="empDTO"
mybatis.type-aliases-package=com.example.demo.dto

