// ========================================================
// Gradle 빌드 설정 파일 (Spring Boot + MariaDB + MyBatis + JSP)
// ========================================================

plugins {
	id 'java'
	id 'war' // 외부 WAS 배포를 위한 WAR 패키징 플러그인
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17) // Java 17
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// [Spring Data & Web]
	implementation 'org.springframework.boot:spring-boot-starter-jdbc' // JDBC 및 커넥션 풀(HikariCP) 지원
	implementation 'org.springframework.boot:spring-boot-starter-web'  // 스프링 MVC 및 내장 톰캣 지원
	
	// [MyBatis]
	// 스프링 부트에서 MyBatis를 간편하게 쓰기 위한 스타터 (SqlSessionFactory, SqlSessionTemplate 자동 등록)
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
	
	// [Lombok]
	// Getter, Setter, 생성자, toString 등을 어노테이션으로 자동 생성해 주는 라이브러리
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	
	// [개발 편의 도구]
	developmentOnly 'org.springframework.boot:spring-boot-devtools' // 소스 변경 시 서버 자동 재시작
	
	// [데이터베이스 드라이버]
	runtimeOnly 'org.mariadb.jdbc:mariadb-java-client' // MariaDB JDBC 드라이버
	
	// [톰캣 런타임]
	providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	
	// [테스트 환경]
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	
	// [JSP 지원 라이브러리]
	// 스프링 부트는 기본적으로 Thymeleaf를 권장하므로, JSP를 뷰로 쓰려면 아래 두 라이브러리가 필수입니다.
	implementation group: 'org.glassfish.web', name: 'jakarta.servlet.jsp.jstl', version: '2.0.0' // JSTL 태그 라이브러리 (<c:forEach> 등)
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper' // JSP를 파싱하고 서블릿으로 컴파일해 주는 Jasper 엔진
	
	// [log4jdbc]
	// 실행되는 SQL문과 파라미터 값, 쿼리 수행 시간을 콘솔에 정돈된 표 형태로 출력
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16'
}

tasks.named('test') {
	useJUnitPlatform()
}

