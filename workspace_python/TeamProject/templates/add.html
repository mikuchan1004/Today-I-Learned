<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 작성</title>
</head>
<body>
    <h1>글 작성</h1>
    <form method="post" action="/api/add">
        <input type="text" name="author" id="author" placeholder="작성자 이름을 입력해주세요"><br>
        <input type="text" name="title" id="title" placeholder="제목을 입력해주세요"><br>
        <input type="text" name="date" id="date" placeholder="작성일을 입력해주세요"><br>
        <textarea name="detail" id="detail" placeholder="내용을 입력해주세요"></textarea><br>
        <br>
        <input type="submit" value="추가">
        <a href="/board">
            <input type="button"value='취소'>
        </a>
    </form>
</body>
</html>
