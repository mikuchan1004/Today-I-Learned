<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
</head>
<body>
    <h1>게시판</h1>
    <a href="/add">글 작성</a>
    <table border="1">
        <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
            <th>조회수</th>
            <th>좋아요</th>
        </tr>
        </thead>
        <tbody>
            {%if board_list %}
                {%for board in board_list%}
                <tr>
                    <td>{{board.id}}</td>
                    <td><a href='/detail/{{board.id}}'>{{board.title}}</a></td>
                    <td>{{board.author}}</td>
                    <td>{{board.date}}</td>
                    <td>{{board.view}}</td>
                    <td>{{board.like}}</td>
                </tr>
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="6">조회할 글이 없습니다.</td>
                </tr>
                {% endif %}
        </tbody>
    </table>
</body>
</html>
