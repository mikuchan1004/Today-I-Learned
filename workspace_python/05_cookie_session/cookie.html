<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .popup {
            border : 2px solid black;
            padding : 20px;
            position: absolute;
            top : 20px;
            left : 30px;
            background-color : white;
        }
        .hide {
            display: none;
        }
    </style>
    <script>
        window.onload = () => {
            document.querySelector('#btn1').addEventListener('click' , () =>{
                // 만료일이 없는 세션 쿠키 생성
                document.cookie = "key=value"
            })
            document.querySelector('#btn2').addEventListener('click' , () => {
                // max-age : 만료일을 뜻하고, 단위는 초
                document.cookie = `mode=attack; max-age=${60*60*2}`
                document.cookie = `heal=full; max-age=${60*60*24}`
            })

            document.querySelector('#btn3').addEventListener('click' , () => {
              console.log(document.cookie)
            
              
              // 쿠키 중 heal의 값이 'full'이면 
              // '힐 합니다' 출력
              // 아니면 '힐  안합니다' 출력 

              document.cookie.split(';  ') 
                for(cookie  of  cookies) {
                    console.log(cookie)

                    name = cookie.split('=')[0]
                    value = cookie.split('=')[1]

                    if (name == 'heal') {
                        if(value == 'full') {
                            console.log('힐 합니다.') 
                        } else {
                            console.log('힐 안합니다.')
                        }
                    } else {
                        console.log('힐 안합니다')
                    }
                }
            })
            // 새로 고침 했을떄, 쿠키가 있으면 팝업이 가려지고, 쿠키가 없으면 팝업이 보이게끔 
            if (document.cookie.includes('popup=closed')) {
                document.querySelector('.popup').classList.add('hide')
            }
            // 닫기 버튼 클릭 시 팝업이 보이지 않게 처리
             document.querySelector('.close').addEventListener('click', () => {
                document.querySelector('.popup').classList.add('hide')
                    // 닫을 때 체크가 되어있다면 10초 짜리 쿠키 설정
                    document.querySelector('.chk').checked 
                        document.cookie = `popup=closed; max-age=${10}`
             })

       
        }
    </script>
</head>
<body>
    <button type="button" id="btn1">btn1</button>
    <button type="button" id="btn2">btn2</button>
    <button type="button" id="btn3">btn3</button>
    
    <div class="popup">
        <div>
            너무 너무 중요한 공지<br><br>
        </div>
        <div>
            <input type="checkbox" class="chk"> 10초간 안 보이기
            <button type="button" class="close">닫기</button>
        </div>
    </div>
    <!--
    
    1. 닫기 버튼 클릭 시 무조건 팝업 안보이게 처리 
    2. 닫을 때 체크가 되어있다면
        - 10초짜리 쿠키 설정
    3. 새로고침 할 때 
        - 쿠키가 있다면 팝업 안보이게 처리 
        - 쿠키가 없을 때만 팝업 보이게
    -->

</body>
</html>
