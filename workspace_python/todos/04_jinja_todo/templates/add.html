<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 추가 페이지</title>
 <style>
    /* 기본 레이아웃 및 폰트 설정 */
    body {
        font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 500px;
        margin: 50px auto;
        padding: 25px;
        background-color: #f8f9fa;
        color: #333;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
    }

    h1, h2 {
        color: #2c3e50;
        font-size: 1.5rem;
        margin-bottom: 20px;
        padding-bottom: 10px;
        border-bottom: 2px solid #e9ecef;
    }

    /* 테이블 스타일링 (전체 목록용) */
    table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 15px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.03);
    }

    th, td {
        padding: 12px 15px;
        text-align: center;
        border: 1px solid #e9ecef;
    }

    th {
        background-color: #4a90e2;
        color: white;
        font-weight: 600;
    }

    tr:hover {
        background-color: #f1f5f9;
    }

    /* 입력 폼 스타일링 (추가/수정 페이지용) */
    input[type="text"] {
        width: 100%;
        padding: 10px;
        margin: 6px 0 16px 0;
        display: inline-block;
        border: 1px solid #ced4da;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 0.95rem;
    }

    input[type="text"]:focus {
        border-color: #4a90e2;
        outline: none;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    /* 버튼 및 링크 버튼 스타일링 */
    input[type="submit"], button, .btn {
        background-color: #4a90e2;
        color: white;
        padding: 9px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background-color 0.2s;
    }

    input[type="submit"]:hover, button:hover {
        background-color: #357abd;
    }

    input[type="button"] {
        background-color: #6c757d;
        color: white;
        padding: 9px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 0.9rem;
    }

    input[type="button"]:hover {
        background-color: #5a6268;
    }

    /* 일반 링크 버튼 스타일링 */
    a {
        color: #4a90e2;
        text-decoration: none;
        font-weight: 500;
        margin-right: 8px;
    }

    a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>
    <h1>추가 페이지</h1>
    <div>
        <form method="post" action="/api/add">
            <input type="text" name="id" placeholder="아이디를 입력해주세요"><br>
            <input type="text" name="item" placeholder="내용을 입력해주세요"><br>
            <input type="submit" value="등록">
            <a href="/list">
                <input type="button" value="취소">
            </a>
        </form>
    </div>
</body>
</html>
