<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수정 페이지</title>
</head>
<body>
    <h2>수정 페이지</h2>
    <form method="post" action="/api/update">
        <input type="text" name="id" value="{{todo.id}}" placeholder="아이디" readonly><br>
        <input type="text" name="item" value="{{todo.item}}" placeholder="내용을 입력해주세요"><br>

        <input type="submit" value="수정완료">
        <a href="/detail/{{todo.id}}"><input type='button' value='목록으로'></a>
    </form>
</body>
</html>
