<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 전체 목록</title>
</head>
<body>
    <h2>📋 Todo 전체 목록</h2>

    <!-- 새 Todo를 작성할 수 있는 추가 페이지(/add) 이동 버튼 -->
    <a href="/add">
        <button type="button">새 Todo 추가하기</button>
    </a>

    <hr>

    <ul>
        <!-- 
          [Jinja2 반복문]
          백엔드에서 넘겨받은 'todos' 리스트를 순회하며 항목을 하나씩 반복 출력합니다.
          'for todo in todos' 구문 끝에는 %를 꼭 붙여주셔야 오타 에러가 안 납니다!
        -->
        {% for todo in todos %}
        <li>
            <!-- Todo ID 출력 -->
            <strong>[ID : {{ todo.id }}]</strong>

            <!-- 
              Todo 항목 클릭 시 해당 항목의 고유 상세 페이지(/todo/ID)로 동적 이동하도록 
              a 태그 href 속성 안에 {{ todo.id }}를 매핑합니다.
            -->
            <a href="/todo/{{ todo.id }}">{{ todo.item }}</a>
        </li>

        <!-- 
          [Jinja2 for-else 구문]
          'todos' 리스트가 비어있을 경우(등록된 Todo가 0개일 때) 자동으로 아래 <li>문구가 출력됩니다.
        -->
        {% else %}
            <li>등록된 Todo가 없습니다. 새로운 할 일을 추가해 보세요!</li>
        {% endfor %} <!-- Jinja2 반복문 종료 알림 -->
    </ul>
</body>
</html>
