<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>추가 페이지</title>
</head>
<body>
    <h2>Todo 추가 페이지</h2>
    <!-- 절대경로 대신 상대경로 /add 사용-->
    <form method="post" action="/add">
        <input type="text" name="id" placeholder="아이디를 입력해주세요"><br>
        <br>
        <input type="text" name="item" placeholder="내용을 입력해주세요"><br>
        <br>
        <button type="submit">추가</button>
        <!-- 취소 버튼은 전체 조회 페이지('/')로 돌아가도록 a 태그 활용-->
         <a href="/">
             <button type="button">취소</button>
         </a>
    </form>
</body>
</html>
