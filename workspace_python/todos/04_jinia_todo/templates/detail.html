<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 상세 보기</title>
</head>
<body>
    <h2>🔍 Todo 상세 보기</h2>

    <!-- 
      [Jinja2 변수 출력]
      백엔드(api.py)에서 context={'todo': target}으로 넘겨준 todo 객체(딕셔너리)의 값을 
      {{ todo.id }} 와 {{ todo.item }} 구문으로 화면에 출력합니다.
    -->
    <div>
        <strong>ID:</strong> {{ todo.id }}<br>
        <strong>내용:</strong> {{ todo.item }}
    </div>

    <hr>

    <!-- 버튼 배치 레이아웃 -->
    <div style="display: flex; gap: 8px;">
        
        <!-- 1. 수정 페이지로 이동하는 동적 URL 링크 (GET 요청) -->
        <a href="/todo/{{ todo.id }}/edit">
            <button type="button">수정</button>
        </a>

        <!-- 
          2. 삭제 처리 (POST 요청)
          - 데이터 삭제는 서버 데이터 변경을 수반하므로 단순 <a> 링크가 아닌 POST Form을 사용합니다.
          - onsubmit="return confirm(...)": 실수로 삭제 버튼을 눌렀을 때를 방지하는 브라우저 확인 경고창입니다.
        -->
        <form action="/todo/{{ todo.id }}/delete" method="post" onsubmit="return confirm('정말 이 Todo를 삭제하시겠어요?')">
            <button type="submit">삭제</button>
        </form>

        <!-- 3. 메인 목록으로 돌아가는 버튼 (GET 요청) -->
        <a href="/">
            <button type="button">전체 목록으로</button>
        </a>
    </div>
</body>
</html>
