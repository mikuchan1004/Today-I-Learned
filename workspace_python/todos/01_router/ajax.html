<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajax</title>
    <script>
        window.onload = () => {
            document.querySelector('#todo').addEventListener('click', function(){

                id = document.querySelector('#id').value
                item = document.querySelector('#item').value
                param = {
                    id: id,
                    item 
                }
                
                fetch('http://127.0.0.1:8000/todo', {
                    method : 'POST' , 
                    headers : {
                        "Content-Type" : "application/json"
                    },
                    body : JSON.stringify(param) 
                })
                .then(function(response){
                    return response.json()
                }).then(function(data){
                    console.log(data)
                }).catch(function(err){
                    console.error(err)
                })
            })

            document.querySelector('#todo2').addEventListener('click', function(){
                new Promise(function(resolve, reject){
                    setTimeout(function(){
                        try {
                            console.log('지금이니!!')
                            resolve("메세지")
                        }catch(e) {
                            reject("메세지")
                        }
                    }, 1000)
                }).then(function(data){
                    console.log("then에서 출력 :", data)
                }).catch(function(data){
                    console.error('catch에서 출력 :', data)
                })

            })

            document.querySelector('#todo3').addEventListener('click', async function(){
                console.log('시작전')
                // const data = await new Promise(function(resolve, reject){
                //     setTimeout(function(){
                //         try {
                //             console.log('지금이니!!')
                //             resolve("메세지")
                //         }catch(e) {
                //             reject("메세지")
                //         }
                //     }, 1000)
                // })

                await new Promise(resolve => setTimeout(resolve, 1000))
                console.log('이후')        
            })

            document.querySelector('#todo4').addEventListener('click', async function(){

                id = document.querySelector('#id').value
                item = document.querySelector('#item').value
                param = {
                    id: id,
                    item 
                }
                
                let response = await fetch('http://127.0.0.1:8000/todo', {
                    method : 'POST' , 
                    headers : {
                        "Content-Type" : "application/json"
                    },
                    body : JSON.stringify(param) 
                })
               console.log(response)
               console.log('------------')
               console.log(await response.json())
            })

            document.querySelector('#todo43').addEventListener('click', async function(){

                itemValue = document.querySelector('#item_todo43').value
                
                let response = await fetch('http://127.0.0.1:8000/todo43', {
                    method : 'POST' , 
                    headers : {
                        "Content-Type" : "application/json"
                    },
                    body : JSON.stringify({
                        id: 1,         
                        item: itemValue 
                    }) 
                })
               console.log(response)
               console.log('------------')
               console.log(await response.json())
            })

        }
    </script>
</head>
<body>
    <h3>todo1</h3>
    <form method="post" action="http://127.0.0.1:8000/todo/param2" >
        id : <input type="text" name="id"><br>
        <br>
        item : <input type="text" name="item"><br>
        <br>
        <input type="submit" value="전송">
    </form>
    <hr>
    <h3>todo2</h3>
    <div>
        id : <input type="text" name="id" id="id"><br>
        <br>
        item : <input type="text" name="item" id="item"><br>
        <button id="todo">todo 추가</button><br>
        <button id="todo2">todo 추가-동기1</button><br>
        <button id="todo3">todo 추가-동기2</button><br>
        <button id="todo4">todo 추가-동기3</button><br>
    </div>
    <hr>
    <h3>구구단을 출력해보자</h3>
   <form method="post" action="http://127.0.0.1:8000/todo/param3" >
        1~9까지의 숫자를 입력해주세요 : <input type="text" name="number"><br>
        <br>
        <input type="submit" value="전송">
    </form>
    <hr>
    <h3>두 숫자의 합 구하기</h3>
    <form method="post" action="http://127.0.0.1:8000/todo/param4" >
        첫번째 숫자를 입력해주세요 : <input type="text" name="num1"><br>
        <br>
        두번째 숫자를 입력해주세요 : <input type="text" name="num2"><br>
        <br>
        <input type="submit" value="전송">
    </form>
    <hr>
    <h3>웹 버전 계산기</h3>
     <form method="post" action="http://127.0.0.1:8000/todo/param5" >
        첫번째 숫자를 입력해주세요 : <input type="text" name="num_int1"><br>
        <br>
        연산자를 입력해주세요 : <input type="text" name="operator"><br>
        <br>
        두번째 숫자를 입력해주세요 : <input type="text" name="num_int2"><br>
        <br>
        <input type="submit" value="전송">
    </form>
    <hr>
        item : <input type="text" name="item" id="item_todo43"><br>
        <br>
      <button id="todo43">전송</button><br>
    <hr>
</body>
</html>
